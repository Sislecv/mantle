<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantle - Deltarune Chapter 1 (8-Bit Demake)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c0b10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    .crt-container {
      position: relative;
      padding: 16px;
      background: radial-gradient(circle at center, #1b1b26 0%, #08080c 100%);
      border: 4px solid #3a324a;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.8);
    }
    .crt-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: linear-gradient(rgba(18, 16, 26, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
                  linear-gradient(90deg, rgba(255, 0, 80, 0.02), rgba(0, 255, 100, 0.01), rgba(80, 80, 255, 0.02));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      border-radius: 4px;
    }
    #game-canvas {
      display: block;
      width: calc(256px * 3);
      height: calc(240px * 3);
      max-width: 90vw;
      max-height: 90vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #000000;
      border: 2px solid #201830;
      box-shadow: 0 0 16px rgba(66, 40, 100, 0.4);
    }
    .footer-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #7b7190;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="crt-container">
    <canvas id="game-canvas" width="256" height="240"></canvas>
  </div>
  <div class="footer-hint">
    [ARROWS / WASD] Move &nbsp;|&nbsp; [Z / J] Action &nbsp;|&nbsp; [X / K] Cancel/Run &nbsp;|&nbsp; [C / L] Menu
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
